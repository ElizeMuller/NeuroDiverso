    <main class="cadastro" id="conteudo">
        <h2>Cadastre-se e faça parte da nossa comunidade</h2>
        - <form id="form-cadastro" action="/enviar" method="post">
    
    <fieldset>
    
    <legend> Seus dados</legend>
    
    <label for="nome">Nome:</label>
    
    <input type="text" class="forminput" id="nome" name="nome" required> <br><br>
    
    <label for="email">E-mail:</label>
    
    <input type="email" class="forminput" id="email" name="email" required><br><br>
    <label for="nascimento">Data de Nascimento:</label>
    <input type="date" class="forminput" id="nascimento" name="nascimento" required> <br><br>    
    <label for="CPF">CPF:</label>
    <Input type="text" class="forminput" pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}" placeholder="000.000.000-00" title="Formato exigido: 000.000.000-00" id="CPF" name="CPF" required> <br><br>
    <label for="telefone">Telefone:</label>
    <input type="tel" class="forminput" pattern="\([0-9]{2}\) [0-9]{4,5}-[0-9]{4}" placeholder="(00) 00000-0000" title="Formato exigido: (00) 00000-0000" id="telefone" name="telefone" required> <br><br>
    <label for="CEP">CEP:</label>
    <input type="text" class="forminput" pattern="[0-9]{5}-[0-9]{3}" placeholder="00000-000" title="Formato exigido: 00000-000" id="CEP" name="CEP" required> <br><br>
    <label for="mensagem">Mensagem:</label><br>
    
    <textarea id="mensagem" class="forminput" name="mensagem" rows="4" cols="30"></textarea><br>
    
    <button type="submit">Enviar Mensagem</button>
    </fieldset>
    </form>
<div id="toast" class="toast">
        Mensagem enviada com sucesso!
